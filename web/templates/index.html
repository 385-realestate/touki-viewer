<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登記簿 PDF パーサー</title>
<style>
:root{font-family:"Yu Gothic UI",system-ui,sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.bar{background:#12233f;color:#fff;padding:18px 5vw;border-left:7px solid #31a36b}.bar h1{margin:0;font-size:clamp(20px,3vw,28px)}.bar p{margin:5px 0 0;color:#b8c9e3}.wrap{max-width:1080px;margin:28px auto;padding:0 18px}.drop{display:block;border:2px dashed #8aa0bc;background:#fff;border-radius:14px;padding:34px;text-align:center;cursor:pointer}.drop.drag{border-color:#23885a;background:#edfff6}.drop input{display:none}.actions{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}button{border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;background:#1f6feb;color:#fff}button.secondary{background:#fff;color:#234;border:1px solid #bbc7d6}button:disabled{opacity:.45}.status{color:#53657c}.card{background:#fff;border:1px solid #d7e0eb;border-left:5px solid #31a36b;border-radius:10px;margin:15px 0;padding:18px;box-shadow:0 2px 10px #14243b12}.card.error{border-left-color:#c23b3b}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#e3f5eb;color:#176a43;font-size:12px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 20px;margin:14px 0}.field{border-bottom:1px solid #edf0f4;padding:7px 0}.field small{display:block;color:#708097}.owners{background:#effaf4;border:1px solid #8fcaaa;border-radius:8px;padding:12px;margin:12px 0}.history{margin-top:12px}.history summary{cursor:pointer;font-weight:bold}.entry{margin:8px 0;padding:9px;background:#f7f9fc;border-radius:6px;white-space:pre-wrap}@media(max-width:600px){.drop{padding:24px 12px}.wrap{padding:0 10px}}
</style></head><body>
<header class="bar"><h1>登記簿 PDF パーサー</h1><p>土地・建物の全部事項証明書をブラウザから解析</p></header>
<main class="wrap"><label class="drop" id="drop"><input id="files" type="file" accept="application/pdf,.pdf" multiple><strong>PDFを選択、またはここへドロップ</strong><br><span>最大20件・合計50MB</span></label>
<div class="actions"><button id="run">解析する</button><button id="csv" class="secondary" disabled>CSV出力</button><span id="status" class="status"></span></div><section id="results"></section></main>
<script>
const prefix={{ prefix|tojson }}, input=document.querySelector('#files'),drop=document.querySelector('#drop'),run=document.querySelector('#run'),csv=document.querySelector('#csv'),statusEl=document.querySelector('#status'),box=document.querySelector('#results');let latest=[];
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{input.files=e.dataTransfer.files;showCount()});input.addEventListener('change',showCount);function showCount(){statusEl.textContent=`${input.files.length}件を選択中`}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(item){if(item.error)return `<article class="card error"><h3>${esc(item.filename)}</h3><p>${esc(item.error)}</p></article>`;const r=item.record||{},h=item.history||{},type=item.doc_type==='tochi'?'土地':'建物',primary=item.doc_type==='tochi'?[['所在',r['所在']],['地番',r['地番']],['地目',r['地目']],['地積（㎡）',r['地積_m2']]]:[['所在',r['所在']],['家屋番号',r['家屋番号']],['種類',r['種類']],['構造',r['構造']],['床面積',r['床面積_m2']]];const fields=primary.map(([k,v])=>`<div class="field"><small>${k}</small>${esc(v||'—')}</div>`).join('');const owners=(r['所有者氏名']||'').split('；').filter(Boolean).map((o,i)=>`<div>${i+1}. ${esc(o)}</div>`).join('')||'所有者を抽出できませんでした';const hist=(h.kouku||[]).map(x=>`<div class="entry"><b>${esc(x['順位']||'')} ${esc(x['登記の目的']||'')}</b>　${esc(x['状態']||'')}<br>${esc(x['所有者住所']||'')} ${esc(x['所有者氏名']||'')}</div>`).join('');return `<article class="card"><span class="tag">${type}</span><h2>${esc(item.filename)}</h2><div class="grid">${fields}</div><div class="owners"><b>現在の所有者</b>${owners}</div><details class="history"><summary>甲区履歴（${(h.kouku||[]).length}件）</summary>${hist||'履歴なし'}</details></article>`}
run.addEventListener('click',async()=>{if(!input.files.length)return alert('PDFを選択してください');run.disabled=true;csv.disabled=true;box.innerHTML='';statusEl.textContent='解析中…';const fd=new FormData();[...input.files].forEach(f=>fd.append('files',f));try{const res=await fetch(`${prefix}/api/analyze`,{method:'POST',body:fd});const data=await res.json();if(!res.ok)throw new Error(data.error||'解析に失敗しました');latest=data.results;box.innerHTML=latest.map(render).join('');csv.disabled=!latest.some(x=>x.record);statusEl.textContent=`完了: ${latest.filter(x=>x.record).length}/${latest.length}件`;}catch(e){statusEl.textContent=e.message}finally{run.disabled=false}});
csv.addEventListener('click',async()=>{const res=await fetch(`${prefix}/api/export.csv`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({results:latest})});const blob=await res.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='touki_results.csv';a.click();URL.revokeObjectURL(a.href)});
</script></body></html>
