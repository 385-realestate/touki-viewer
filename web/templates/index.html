<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登記簿ビューアー</title>
  <link rel="stylesheet" href="{{ prefix }}/static/app.css">
  <script defer src="{{ prefix }}/static/app.js"></script>
</head>
<body data-prefix="{{ prefix }}">
  <header class="topbar"><div class="topbar-inner"><div class="brand-mark">登</div><div>
    <h1>登記簿ビューアー</h1><p>表題部・甲区・乙区・共同担保目録を一画面で確認</p>
  </div></div></header>
  <main class="workspace">
    <section class="upload-panel" aria-label="PDF解析">
      <label class="drop-zone" id="drop">
        <input id="files" type="file" accept="application/pdf,.pdf" multiple>
        <span class="drop-icon">⇧</span>
        <strong>登記簿PDFを選択、またはドロップ</strong>
        <small>最大20件・合計50MB。解析後に原本PDFと並べて確認できます。</small>
      </label>
      <div class="toolbar"><button id="run" type="button">解析する</button>
        <button id="csv" type="button" class="secondary" disabled>一覧CSVを保存</button>
        <button id="history-csv" type="button" class="secondary" disabled>全履歴CSVを保存</button>
        <span id="status" role="status" aria-live="polite">PDFを選択してください</span>
      </div>
    </section>
    <nav id="document-tabs" class="document-tabs" aria-label="解析した書類"></nav>
    <section id="results" aria-live="polite"></section>
  </main>
</body>
</html>
